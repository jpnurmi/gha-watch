[package]
name = "gha-watch"
version = "0.1.0"
description = "A minimal GitHub Actions tray watcher"
authors = ["jpnurmi"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
tauri = { version = "2.11.2", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.4"
tauri-plugin-shell = "2.3.5"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6.12"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSView", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CALayer", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSString", "NSUserNotification"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
tauri-plugin-window-state = "2.4.1"
notify-rust = "4.17.0"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8.1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.5.1"
