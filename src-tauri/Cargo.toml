[package]
name = "gha-watch"
version = "0.1.0"
description = "A minimal GitHub Actions tray watcher"
authors = ["jpnurmi"]
license = "MIT"
edition = "2021"

[features]
screenshots = ["dep:webview2-com", "windows/Win32_System_Com", "windows/Win32_UI_Shell", "objc2-app-kit/NSWindow", "dep:webkit2gtk", "dep:cairo-rs", "dep:sha2"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
tauri = { version = "2.11.2", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.4"
tauri-plugin-shell = "2.3.5"
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6.12"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSView", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CALayer", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSEnumerator", "NSKeyValueCoding", "NSString", "NSUUID", "NSUserNotification", "NSValue"] }
sha2 = { version = "0.10.9", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
tauri-plugin-window-state = "2.4.1"
notify-rust = "4.17.0"
zbus = "5.15.0"
cairo-rs = { version = "0.18.5", features = ["png"], optional = true }
webkit2gtk = { version = "2.0.2", features = ["v2_16"], optional = true }

[target.'cfg(windows)'.dependencies]
webview2-com = { version = "0.39.1", optional = true }
tauri-winrt-notification = "0.8.1"
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Controls"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.5.1"
